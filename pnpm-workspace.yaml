# Dependency Resolution Settings
minimumReleaseAge: 4320 # 3 days
minimumReleaseAgeExclude:
  - "@dnd-mapp/*"
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # 3 days

# Peer Dependency Settings
autoInstallPeers: false
dedupePeers: true
strictPeerDependencies: true

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds: {}

# Other Settings
catalogMode: "strict"
savePrefix: "~"

catalog:
  "@types/node": ~24.13.5
  typescript: ~6.0.3
catalogs:
  prettier:
    "@dnd-mapp/config-prettier": ~1.0.0
    prettier: ~3.9.7
